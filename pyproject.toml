[project]
name = "rag-document-chatbot"
version = "0.1.0"
description = "RAG-based Document Chatbot using Streamlit, LangChain, FAISS/ChromaDB, and Google Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.37.0",
    "python-dotenv>=1.0.1",
    "pypdf>=4.3.1",
    "langchain>=0.2.14",
    "langchain-classic>=1.0.0",
    "langchain-community>=0.2.12",
    "langchain-core>=0.2.33",
    "langchain-google-genai>=1.0.8",
    "faiss-cpu>=1.8.0",
    "chromadb>=0.5.5",
    'pysqlite3-binary>=0.5.3; sys_platform != "win32"',
]
